<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Development Workspace</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">AI <strong>Development Workspace</strong></div><div class="actions"><button id="notify" class="secondary" type="button">알림 켜기</button><button id="logout" class="secondary" type="button">로그아웃</button><span id="connection">연결 확인 중</span></div></header>
<main>
  <section id="login" class="card hidden"><h1>Workspace 로그인</h1><p>로컬 Workspace 토큰을 입력하세요.</p><form id="login-form"><input id="token" type="password" autocomplete="current-password" required aria-label="접근 토큰"><button>로그인</button></form><p id="login-error" class="error"></p></section>
  <div id="workspace" class="hidden">
    <div class="project-bar"><label>프로젝트<select id="project"></select></label><span id="project-stack" class="muted"></span></div>
    <nav><button id="nav-dashboard" class="selected">대시보드</button><button id="nav-task">작업 상세</button><button id="nav-design">디자인 검토</button></nav>
    <section id="dashboard"><div class="heading"><div><h1>협업 현황</h1><p>AI와 사람의 독립 작업을 함께 관리합니다.</p></div><button id="refresh">새로고침</button></div>
      <div id="counts" class="counts"></div>
      <section class="card"><h2>운영 지표</h2><div id="metrics" class="metrics"></div></section>
      <form id="new-task" class="card"><h2>새 작업</h2><label>목표<textarea id="goal" minlength="8" maxlength="5000" required placeholder="완료할 목표와 검증할 결과를 입력하세요"></textarea></label>
        <div class="fields"><label>저장소<select id="repo"></select></label><label>작업 유형<select id="task-type"><option value="AI_TASK">AI 작업</option><option value="HUMAN_TASK">사람 작업</option><option value="COLLABORATIVE_TASK">협업 작업</option></select></label><label>실행 모드<select id="mode"><option value="">자동</option><option>FAST</option><option>SPECIALIST</option><option>REVIEW</option><option>EXPLORE</option></select></label><label>실행기<select id="provider"><option value="">자동</option><option value="claude">Claude</option><option value="codex">Codex</option></select></label><label>우선순위<input id="priority" type="number" value="0" min="-10" max="10"></label></div>
        <label>완료 조건<input id="criteria" maxlength="2000" placeholder="어떤 결과가 나오면 완료인가요?"></label><label>선행 작업<select id="depends" multiple size="3" aria-label="선행 작업"></select></label><button>작업 생성</button></form>
      <div class="columns"><div><section class="card"><h2>AI가 하고 있는 일</h2><div id="ai-working"></div></section><section class="card"><h2>지금 할 수 있는 일</h2><div id="human-now"></div></section><section class="card"><h2>다음 실행 예정</h2><div id="next-queue"></div></section><section class="card"><h2>완료한 작업</h2><div id="completed"></div></section></div>
        <div><section class="card"><h2>결정이 필요한 일</h2><div id="decisions-now"></div></section><section class="card"><h2>차단된 작업</h2><div id="blocked"></div></section><section class="card"><h2>실행기</h2><div id="worker-list"></div></section></div></div>
    </section>
    <section id="task-detail" class="hidden"><div class="heading"><h1>작업 상세</h1><button id="back">목록으로</button></div><div id="task-content"></div></section>
    <section id="design-review" class="hidden"><div class="heading"><h1>디자인 검토</h1><a id="lab-link" href="#" target="_blank" rel="noopener noreferrer" class="hidden">Expo Design Lab 열기</a></div><p>시안과 근거를 비교한 뒤 사람이 최종 선택합니다.</p><div id="design-content"></div></section>
  </div>
</main><script type="module" src="/app.js"></script></body></html>
