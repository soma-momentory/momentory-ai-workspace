default_permissions = "workspace-lab"

[permissions.workspace-lab.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
"~/.local/node_modules/@openai/codex-linux-x64" = "read"
"~/.local/node_modules/@openai/codex" = "read"
"~/.local/node_modules/node" = "read"
"/etc" = "read"
"/mnt/wsl/resolv.conf" = "read"
glob_scan_max_depth = 8

[permissions.workspace-lab.filesystem.":workspace_roots"]
"." = "write"
"node_modules" = "read"
".git" = "read"
"**/.env*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/credentials.json" = "deny"

[permissions.workspace-lab.network]
enabled = true
