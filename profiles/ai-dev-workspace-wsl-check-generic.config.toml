default_permissions = "workspace-check-locked"

[permissions.workspace-check-locked.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
"~/.local/node_modules/@openai/codex-linux-x64" = "read"
"~/.local/node_modules/@openai/codex" = "read"
"~/.local/node_modules/node" = "read"
glob_scan_max_depth = 8

[permissions.workspace-check-locked.filesystem.":workspace_roots"]
"." = "write"
"data" = "deny"
"node_modules" = "read"
".git" = "read"
"**/.env*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/credentials.json" = "deny"

[permissions.workspace-check-locked.network]
enabled = true
