default_permissions = "workspace-setup"

[permissions.workspace-setup.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
"__MAC_NODE_DIR__" = "read"
"__MAC_NPM_ROOT__" = "read"
glob_scan_max_depth = 32

[permissions.workspace-setup.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
"**/.env*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/credentials.json" = "deny"

[permissions.workspace-setup.network]
enabled = true
