default_permissions = "workspace-check"

[windows]
sandbox = "mxc"

[permissions.workspace-check.filesystem]
":root" = "read"
":minimal" = "read"
"~" = "deny"
"~/.codex" = "deny"
"~/.claude" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config" = "deny"
"~/.npmrc" = "deny"
"__WORKSPACE_DATA__" = "deny"
"__WORKSPACE_ENV__" = "deny"
glob_scan_max_depth = 32

[permissions.workspace-check.filesystem.":workspace_roots"]
"." = "write"
".git" = "read"
".agents" = "read"
".codex" = "read"
".aws" = "deny"
".env" = "deny"
"**/.env*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"
"**/credentials.json" = "deny"

[permissions.workspace-check.network]
enabled = false
